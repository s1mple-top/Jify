[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jify"
version = "0.2.4"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.109.1",
    "fastapi>=0.136.3",
    "mcp>=1.27.1",
    "openai>=2.33.0",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.33.1",
    "rich>=13.0",
    "uvicorn>=0.30",
    "websockets>=16.0",
]

[project.scripts]
jify = "cli.app:main"

[tool.setuptools]
py-modules = [
    "agent_loop", "agent_p2p", "context_manager",
    "event_bus", "experience_extractor",
    "jify_tool", "long_term_memory", "model_client",
    "output_engine", "self_evolution", "skill_detector",
    "skill_verifier", "stream_consumer", "subagent", "team", "user_profile",
    "version_check",
]

[tool.setuptools.packages.find]
include = ["cli", "config", "gateway", "tools", "tools.*", "plugins", "plugins.*", "storage", "storage.*"]
