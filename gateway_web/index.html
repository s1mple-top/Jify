<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jify</title>
<script src="/static/vendor/marked.min.js"></script>
<script>
// marked 为本地 vendored 资源；若加载失败则降级，后续渲染退回纯文本，避免整块内容渲染失败
if (typeof marked !== 'undefined' && marked.setOptions) {
  marked.setOptions({ breaks: true });
}
</script>
<style>
/* ── Reset & Base ── */
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
  background: #faf7f2;
  color: #3d3929;
  height: 100vh;
  display: flex;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d4c5a9; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #b45309; }
/* ── Sidebar ── */
#sidebar {
  width: 240px;
  background: linear-gradient(180deg, #fef9f0 0%, #faf3e6 100%);
  border-right: 1px solid #e8ddcc;
  display: flex; flex-direction: column;
  padding: 20px 16px;
  flex-shrink: 0;
}
#sidebar h2 {
  color: #92400e;
  font-size: 18px; font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 8px;
}
#sidebar .subtitle {
  font-size: 11px; color: #a0907a;
  margin-bottom: 24px;
}
#sidebar .info-block {
  font-size: 11px; color: #8b7355;
  line-height: 1.6;
  padding: 12px;
  background: #fff;
  border: 1px solid #e8ddcc;
  border-radius: 10px;
  margin-bottom: 14px;
  cursor: pointer; user-select: none;
  transition: all .15s;
}
#sidebar .info-block:hover { background: #fdf0dd; border-color: #d4c5a9; }
#sidebar .info-block.active {
  background: linear-gradient(135deg, #b45309, #c45d1d);
  color: #fff;
  border-color: #b45309;
}
#sidebar .info-block.active .label { color: #fff; }
#sidebar .info-block .label { font-weight: 600; color: #b45309; }
#skills-list { margin-top: 4px; font-size: 11px; line-height: 1.7; }
#skills-list .skill-item { color: #8b7355; }
